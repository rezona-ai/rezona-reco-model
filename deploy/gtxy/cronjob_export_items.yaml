apiVersion: batch/v1
kind: CronJob
metadata:
  name: two-tower-lite-export-items
  namespace: production
spec:
  schedule: "15 7 * * *"   # 须在当天 train 结束后;ranker 07:00 起每 5 分钟重试至 08:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: recoleaf
          containers:
          - name: exporter
            image: us-east1-docker.pkg.dev/gtxy-rzn-infra/reco-model/ml-trainer:latest
            imagePullPolicy: Always
            command: ["python", "/app/two_tower_lite/export_item_vectors.py"]
            env:
            - name: GCS_BUCKET
              value: "rezona-ml"
            - name: GCS_ARTIFACTS_PREFIX
              value: "two_tower_lite/artifacts"
            - name: GCS_CKPT_PREFIX
              value: "two_tower_lite/ckpts"
            - name: GCS_ITEM_VECTORS_PREFIX
              value: "two_tower_lite/item_vectors"
            - name: BQ_PROJECT
              value: "gtxy-rzn-infra"
            - name: BQ_TABLE
              value: "gtxy-rzn-infra.ads.ads_game_info_df_view"
            resources:
              requests:
                cpu: "2"
                memory: "4Gi"
              limits:
                cpu: "4"
                memory: "8Gi"
