apiVersion: apps/v1
kind: Deployment
metadata:
  name: two-tower-lite-ranker
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: two-tower-lite-ranker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # 始终保持至少 2 个 pod 在线
  template:
    metadata:
      labels:
        app: two-tower-lite-ranker
    spec:
      serviceAccountName: recoleaf
      # 2026-11-05 起 30→60：preStop 先等 30s，之后 SIGTERM 触发 server.stop(grace=20s)，合计不超过 60s
      terminationGracePeriodSeconds: 60
      # 2026-11-05：两个副本尽量分到不同节点（软约束）。11-04 14:09 两个 pod 在同一节点上被 Autopilot 缩容同时驱逐，
      # 双塔中断约 30s。另见 ranker_pdb.yaml
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: two-tower-lite-ranker
      containers:
      - name: ranker
        # 2026-11-04 起固定 digest（9-23 构建，tag rollback-20260923），与线上一致。不跟 :latest：deploy.sh 每次全量重建 :latest
        # （torch 未锁版本），跟 :latest 时任何一次重启（含 Autopilot 缩容驱逐）都会静默换镜像。升级见 two_tower_lite/serving/README.md「更新 ranker 镜像」
        image: us-east1-docker.pkg.dev/gtxy-rzn-infra/reco-model/ml-trainer@sha256:bc11648dcfa4bb5d3d2ec1fc6bbd3724c2f4f79fb804ae903cf70ee4eb1e269b
        imagePullPolicy: Always
        command: ["python", "/app/two_tower_lite/serving/server.py"]
        env:
        - name: GCS_BUCKET
          value: "rzn-rezona-ml"
        - name: GCS_ARTIFACTS_PREFIX
          value: "two_tower_lite/artifacts"
        - name: GCS_CKPT_PREFIX
          value: "two_tower_lite/ckpts"
        - name: GCS_ITEM_VECTORS_PREFIX
          value: "two_tower_lite/item_vectors"
        - name: GRPC_PORT
          value: "50051"
        - name: GRPC_WORKERS
          value: "4"
        - name: REFRESH_ENABLED
          value: "true"
        # 2026-11-05：限制 torch（OpenMP/MKL）和 numpy（OpenBLAS）的线程数。不设时按节点核数开线程（16 核节点开 16 个），
        # 而 CPU limit 只有 2，会被 CFS 节流：10-26 到 11-04 有 pod 在 16 核节点期间，双塔调用 1–5% 超时。打分计算量很小，单线程足够
        - name: OMP_NUM_THREADS
          value: "1"
        - name: OPENBLAS_NUM_THREADS
          value: "1"
        - name: MKL_NUM_THREADS
          value: "1"
        lifecycle:
          preStop:
            # 2026-11-05：终止时先从 DNS 摘掉、继续服务 30s，reco-leaf（dns:/// + round_robin，重新解析至少间隔 30s）
            # 有时间切到新地址，避免重启时出现几秒的 Unavailable
            sleep:
              seconds: 30
        ports:
        - name: grpc
          containerPort: 50051
          protocol: TCP
        resources:
          requests:
            cpu: "1"
            memory: "3Gi"   # 2026-11-05 起 2Gi→3Gi：每天进程内刷新后常驻约 2.0GiB，贴着申请值时节点内存紧张会被优先驱逐
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 20   # 等待 GCS 下载完成
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: two-tower-lite-ranker
  namespace: production
spec:
  selector:
    app: two-tower-lite-ranker
  clusterIP: None
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
