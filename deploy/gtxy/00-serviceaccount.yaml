# 新项目 gtxy-rzn-infra 的 KSA + Workload Identity 绑定(docs/28 阶段1)。
# GSA 已由 rezona-infra terraform 建好并授权:
#   recoleaf@production → recoleaf-kafka-writer@gtxy-rzn-infra(managedkafka.client + BQ + rezona-ml/datalake 桶)
#   syncer-sa@production → syncer@gtxy-rzn-infra(BQ dataViewer/jobUser)
# reco-model 三仓工作负载 serviceAccountName 均为 recoleaf。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recoleaf
  namespace: production
  annotations:
    iam.gke.io/gcp-service-account: recoleaf-kafka-writer@gtxy-rzn-infra.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: syncer-sa
  namespace: production
  annotations:
    iam.gke.io/gcp-service-account: syncer@gtxy-rzn-infra.iam.gserviceaccount.com
